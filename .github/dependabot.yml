version: 2
updates:
  # Dependabot configuration for workshop-wide NuGet package updates
  - package-ecosystem: "nuget"
    directories:
      - "/Part 02 - Build Chat App/ChatApp/"
      - "/Part 03 - Add RAG/RagChatApp/"
      - "/Part 11 - Deployment/GenAiLab/"
      - "/Part 05 - MCP Server Basics/MyMcpServer/"
      - "/Part 06 - Enhanced MCP Server/ContosoOrdersMcpServer/"
      - "/Part 08 - Agent Framework Basics/AgentApp/"
      - "/Part 09 - Adding AI to an Existing App/StoreApp/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      nuget-all:
        patterns:
          - "*"
    open-pull-requests-limit: 10
