name: Link Checking

on:
  pull_request:
    branches:
      - main
    paths:
      - '**.md'
      - '.markdown-link-check.json'
      - '.github/workflows/link-check.yml'
  schedule:
    # Weekly, so link rot is caught even when the READMEs are not being edited
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-check:
    name: Check Markdown Links
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install markdown-link-check
      run: npm install -g markdown-link-check@3

    - name: Check links
      run: |
        set -euo pipefail
        find . -type f -name "*.md" \
          -not -path "./node_modules/*" \
          -not -path "*/bin/*" \
          -not -path "*/obj/*" \
          -not -path "*/wwwroot/lib/*" \
          -not -path "./docs/archive/*" \
          -print0 | xargs -0 -n1 markdown-link-check --config .markdown-link-check.json --quiet --retry
