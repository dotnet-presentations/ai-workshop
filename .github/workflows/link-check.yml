name: Link Checking

on:
  pull_request:
    branches:
      - main
    paths:
      - '**.md'
      - '.lycheeignore'
      - '.github/workflows/link-check.yml'
  schedule:
    # Weekly, so link rot is caught even when the READMEs are not being edited
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-check:
    name: Check Markdown Links
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run lychee
      uses: lycheeverse/lychee-action@v2
      with:
        args: >-
          --no-progress
          --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0 Safari/537.36"
          --accept 200,206,403,429
          --max-retries 3
          './**/*.md'
        fail: true
